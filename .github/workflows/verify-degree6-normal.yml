name: Verify degree-six normal determinant

on:
  push:
    paths:
      - certificates/verify_degree6_normal.py
      - certificates/check_degree6_source.py
      - certificates/test_degree6_source.py
      - Complete_Affine_Jets_Supplement.tex
      - Complete_Affine_Jets_I.tex
      - .github/workflows/verify-degree6-normal.yml
  pull_request:
    paths:
      - certificates/verify_degree6_normal.py
      - certificates/check_degree6_source.py
      - certificates/test_degree6_source.py
      - Complete_Affine_Jets_Supplement.tex
      - Complete_Affine_Jets_I.tex
      - .github/workflows/verify-degree6-normal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check manuscript source consistency
        run: python certificates/check_degree6_source.py
      - name: Test source consistency guard
        run: python certificates/test_degree6_source.py
      - name: Install SymPy
        run: python -m pip install sympy==1.14.0
      - name: Run checker
        run: python certificates/verify_degree6_normal.py
